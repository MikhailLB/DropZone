org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Disable Kotlin incremental compilation — required whenever the project
# path contains spaces, non-ASCII characters, or any character that the
# incremental cache cannot serialise reliably (notably on Windows).
kotlin.incremental=false

# Flutter migrator flags. Keep both disabled — the gray-part template
# relies on the classic DSL semantics.
android.newDsl=false
android.builtInKotlin=false
