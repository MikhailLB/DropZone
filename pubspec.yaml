name: dropzonegame
description: "Drop Zone - neon ball splitting arcade game"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Persistence
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.0.0

  # Networking / device fingerprint
  http: ^1.4.0
  device_info_plus: ^11.4.0
  connectivity_plus: ^6.1.5
  package_info_plus: ^8.3.1
  url_launcher: ^6.3.2

  # WebView shell
  webview_flutter: ^4.14.0
  webview_flutter_android: ^4.12.0

  # File picker for in-WebView uploads.
  # NOTE: do NOT bump to 10.x or higher — the Kotlin-only registrant
  # collides with Flutter's built-in Kotlin support (see gray pitfalls).
  file_picker: 8.1.4

  # Attribution + remote messaging
  appsflyer_sdk: ^6.16.1
  firebase_core: ^3.14.0
  firebase_messaging: ^15.2.5
  firebase_app_check: ^0.3.2+10
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/webp/
    - assets/shell/

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0D0D1A"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 21
